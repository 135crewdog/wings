name: Tests

on:
  push:
    branches-ignore: [main]   # on main, the Pages workflow runs the tests
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
